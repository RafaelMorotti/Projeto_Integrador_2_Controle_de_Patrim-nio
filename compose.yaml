services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:v1.0.0
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend    
    ports:
      - "80:80"

  db:
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql/data/18/docker
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend:v1.0.0
    container_name: backend
    # working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DEBUG: ${DEBUG:-1}
    depends_on:
      - db

    command: ["sh", "/app/scripts/commands.sh"]


volumes:
  postgres_data:
    driver: local